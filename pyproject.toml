[project]
name = "slm-finetuning-lab"
version = "0.1.0"
description = "Progressive study of SLM fine-tuning techniques: full fine-tuning, LoRA, and QLoRA with benchmarks."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "mlx>=0.31.1",
    "torch>=2.11.0",
    "transformers>=5.4.0",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
